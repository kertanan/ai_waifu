<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waifu Chat Live2D</title>


    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            background-image: url("/Assets/1012111.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Area Kanvas Model 2D */
        .waifu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            /* Supaya klik tidak terhalang kanvas, kecuali pada model */
        }

        #live2d-canvas {
            pointer-events: auto;
            /* Agar model tetap bisa di-klik jika diperlukan */
        }

        /* Desain Kotak Chat */
        .chat-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            height: 35vh;
            /* 35% dari tinggi layar */
            background: rgba(255, 255, 255, 0.5);
            /* 50% transparansi */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            background: rgba(255, 107, 129, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: transparent;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.waifu {
            align-items: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user .bubble {
            background: rgba(0, 123, 255, 0.85);
            color: white;
            border-bottom-right-radius: 0;
        }

        .waifu .bubble {
            background: rgba(255, 255, 255, 0.85);
            color: #333;
            border-bottom-left-radius: 0;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.6);
            color: #333;
        }

        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ff475f;
        }
    </style>
</head>

<body>

    <div class="waifu-container" id="container-3d" style="display: none; z-index: 2;">
        <canvas id="three-canvas"></canvas>
    </div>
    <div class="waifu-container" id="container-2d" style="z-index: 2;">
        <canvas id="live2d-canvas"></canvas>
    </div>
    <!-- Sidebar Thumbnail -->
    <div class="sidebar"
        style="position: absolute; right: 20px; top: 20px; z-index: 10; display: flex; flex-direction: column; gap: 15px;">
        <img src="/Assets/thumbnail/Thumbnail_yiyi.png" onclick="window.switchCharacter('2d')"
            style="width: 80px; height: 80px; border-radius: 10px; cursor: pointer; border: 3px solid #ff6b81; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.3);"
            id="thumb-2d" title="Yiyi (2.5D)">
        <img src="/Assets/thumbnail/Thumbnail_sakura.png" onclick="window.switchCharacter('3d')"
            style="width: 80px; height: 80px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.3);"
            id="thumb-3d" title="Sakura (3D)">
    </div>

    <div class="chat-container" style="z-index: 10;">
        <div class="header">Chat dengan AI Waifu</div>
        <div class="messages" id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik pesanmu di sini..."
                onkeypress="handleKeyPress(event)">
            <button id="mic-btn" onclick="toggleRecording()"
                style="background-color: #6c757d; border-radius: 50%; width: 45px; height: 45px; padding: 0; display: flex; justify-content: center; align-items: center; font-size: 1.2rem;">🎤</button>
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        window.waifuModel2D = null;
        window.waifuModel3D = null;
        window.activeWaifuType = "2d";

        const canvas = document.getElementById('live2d-canvas');
        const app = new PIXI.Application({
            view: canvas,
            autoStart: true,
            transparent: true,
            resizeTo: window
        });
        const modelUrl = '/Character/PinkHair_workshop_2802653785/yiyi_chair.model3.json';

        // Definisi fungsi switchCharacter secara global agar selalu bisa dipanggil
        window.switchCharacter = function (type) {
            const container2D = document.getElementById('container-2d');
            const container3D = document.getElementById('container-3d');
            const thumb2D = document.getElementById('thumb-2d');
            const thumb3D = document.getElementById('thumb-3d');

            if (type === '2d') {
                container2D.style.display = 'block';
                container3D.style.display = 'none';
                window.activeWaifuType = '2d';
                if (thumb2D) thumb2D.style.borderColor = '#ff6b81';
                if (thumb3D) thumb3D.style.borderColor = 'transparent';
                setTimeout(() => app.renderer.resize(window.innerWidth, window.innerHeight), 50);
            } else if (type === '3d') {
                container2D.style.display = 'none';
                container3D.style.display = 'block';
                window.activeWaifuType = '3d';
                if (thumb3D) thumb3D.style.borderColor = '#ff6b81';
                if (thumb2D) thumb2D.style.borderColor = 'transparent';
            }
        };

        PIXI.live2d.Live2DModel.from(modelUrl).then(model => {
            app.stage.addChild(model);

            // Kembalikan anchor ke tengah agar posisinya pas
            model.anchor.set(0.5);

            function resizeModel() {
                // Posisikan ke tengah layar, turun sedikit
                model.x = app.screen.width / 2;
                model.y = app.screen.height / 2 + (app.screen.height * 0.1);

                // Set skala tetap yang sangat kecil agar tidak raksasa
                // Anda bisa mengubah nilai 0.08 ini jika masih kurang pas
                model.scale.set(0.08);
            }

            // Panggil sekali saat dimuat
            resizeModel();

            // Panggil otomatis setiap kali ukuran layar berubah
            window.addEventListener('resize', resizeModel);

            window.waifuModel = model;
            console.log("Model berhasil dimuat!");
        }).catch(err => {
            console.error("Gagal memuat model:", err);
        });


        // --- Audio balasan ---
        // Server mengirim teks dulu, lalu membuat suara di latar belakang.
        // `audio_wait` menunggu sampai suara siap. Antrean `audioQueue` memastikan
        // beberapa balasan diputar bergantian, tidak saling tumpang tindih.
        let audioQueue = Promise.resolve();

        async function getReplyAudioUrl(data) {
            if (data.audio) return data.audio;
            if (!data.audio_wait) return null;
            try {
                const res = await fetch(data.audio_wait);
                const info = await res.json();
                return info.ready ? info.url : null;
            } catch (err) {
                console.warn("Gagal mengambil audio:", err);
                return null;
            }
        }

        function playAudioUrl(url) {
            return new Promise(resolve => {
                const audioBypassCache = url + "?t=" + new Date().getTime();

                // Mainkan suara secara manual menggunakan objek Audio
                const audio = new Audio(audioBypassCache);
                audio.onended = resolve;
                audio.onerror = resolve;
                audio.play().catch(e => { console.error("Gagal memutar audio:", e); resolve(); });

                if (window.waifuModel) {
                    try {
                        // Coba hubungkan ke Live2D untuk lip-sync
                        window.waifuModel.speak(audioBypassCache, { volume: 1.0 });
                    } catch (err) {
                        console.warn("Lip-sync tidak didukung oleh model ini:", err);
                    }
                }
            });
        }

        function playReplyAudio(data) {
            const urlPromise = getReplyAudioUrl(data);   // mulai menunggu sekarang (paralel)
            audioQueue = audioQueue.then(async () => {
                const url = await urlPromise;
                if (url) await playAudioUrl(url);
            });
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';

            try {

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat: text, number: 1 })
                });

                const data = await response.json();
                if (data.balasan) {
                    appendMessage('waifu', data.balasan);

                    // Mainkan audio jika ada (otomatis lip-sync)
                    // Teks sudah tampil; audio dibuat di server lalu diputar begitu siap
                    playReplyAudio(data);
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage('waifu', 'Server backend mati/terputus.');
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;
            messageDiv.appendChild(bubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // --- Fitur Microphone (Voice Chat) ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendVoiceMessage(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.style.backgroundColor = '#ff475f'; // Merah saat merekam
                    micBtn.innerText = '⏹️';
                } catch (error) {
                    console.error('Error accessing mic:', error);
                    alert("Gagal mengakses mikrofon. Pastikan browser memberi izin akses.");
                }
            } else {
                mediaRecorder.stop();
                // Matikan indikator mic di browser
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                micBtn.style.backgroundColor = '#6c757d'; // Kembali abu-abu
                micBtn.innerText = '🎤';
            }
        }

        async function sendVoiceMessage(audioBlob) {
            appendMessage('user', '🎙️ (Pesan Suara...)');

            const formData = new FormData();
            formData.append("audio", audioBlob, "voice_message.webm");

            try {
                const response = await fetch('/api/voice-chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.balasan) {
                    appendMessage('waifu', data.balasan);

                    // Teks sudah tampil; audio dibuat di server lalu diputar begitu siap
                    playReplyAudio(data);
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage('waifu', 'Server gagal memproses suara.');
            }
        }
    </script>
    <script type="module" src="/app.js"></script>
</body>

</html>
