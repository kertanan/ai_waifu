<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ff6b81">
    <title>Waifu Chat Live2D</title>


    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            background-image: url("/Assets/1012111.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Area Kanvas Model 2D */
        .waifu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            /* Supaya klik tidak terhalang kanvas, kecuali pada model */
        }

        #live2d-canvas {
            pointer-events: auto;
            /* Agar model tetap bisa di-klik jika diperlukan */
        }

        /* Desain Kotak Chat */
        .chat-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            height: 35vh;
            /* 35% dari tinggi layar */
            background: rgba(255, 255, 255, 0.5);
            /* 50% transparansi */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            background: rgba(255, 107, 129, 0.7);
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: transparent;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.waifu {
            align-items: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user .bubble {
            background: rgba(0, 123, 255, 0.85);
            color: white;
            border-bottom-right-radius: 0;
        }

        .waifu .bubble {
            background: rgba(255, 255, 255, 0.85);
            color: #333;
            border-bottom-left-radius: 0;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        input {
            flex: 1;
            min-width: 0;
            /* supaya tombol tidak terdorong keluar di layar sempit */
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.6);
            color: #333;
        }

        input:focus-visible {
            border-color: #ff6b81;
            box-shadow: 0 0 0 2px rgba(255, 107, 129, 0.45);
        }

        .input-area button {
            flex-shrink: 0;
            margin-left: 10px;
            padding: 10px 20px;
            background: #ff6b81;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-area button:hover {
            background: #ff475f;
        }

        .input-area .mic-btn {
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: #6c757d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .input-area .mic-btn.recording {
            background: #ff475f;
        }

        button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* Header chat = tombol untuk menciutkan/membuka panel */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: none;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .header .chevron {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .chat-container.collapsed .header .chevron {
            transform: rotate(180deg);
        }

        .chat-container.collapsed {
            height: auto;
        }

        .chat-container.collapsed .messages {
            display: none;
        }

        /* Pilihan karakter */
        .char-switch {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .char-thumb {
            padding: 0;
            border: 3px solid transparent;
            border-radius: 10px;
            background: none;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            line-height: 0;
        }

        .char-thumb.active {
            border-color: #ff6b81;
        }

        .char-thumb img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            display: block;
        }

        /* ---------- HP / layar sempit ---------- */
        @media (max-width: 640px) {
            body,
            .waifu-container {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                /* tinggi yang benar walau address bar browser muncul/hilang */
            }

            /* Panel chat menempel di bawah, selebar layar */
            .chat-container {
                left: 0;
                right: 0;
                bottom: 0;
                transform: none;
                width: 100%;
                max-width: none;
                height: 42vh;
                height: 42dvh;
                border-radius: 18px 18px 0 0;
                border-bottom: none;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .chat-container.collapsed {
                height: auto;
            }

            .header {
                padding: 8px 10px 10px;
                flex-direction: column;
                gap: 4px;
                font-size: 0.95rem;
            }

            /* Pegangan kecil di atas header, tanda panel bisa ditarik/ditap */
            .header::before {
                content: "";
                width: 36px;
                height: 4px;
                border-radius: 2px;
                background: rgba(255, 255, 255, 0.8);
            }

            .header .chevron {
                display: none;
            }

            .messages {
                padding: 12px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 8px;
                gap: 8px;
            }

            .input-area button {
                margin-left: 0;
                padding: 10px 16px;
            }

            input {
                font-size: 16px;
                /* < 16px membuat iPhone otomatis zoom saat mengetik */
            }

            .char-switch {
                top: calc(10px + env(safe-area-inset-top));
                right: 10px;
                gap: 8px;
            }

            .char-thumb {
                border-width: 2px;
                border-radius: 12px;
            }

            .char-thumb img {
                width: 48px;
                height: 48px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .header .chevron {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="waifu-container" id="container-3d" style="display: none; z-index: 2;">
        <canvas id="three-canvas"></canvas>
    </div>
    <div class="waifu-container" id="container-2d" style="z-index: 2;">
        <canvas id="live2d-canvas"></canvas>
    </div>
    <!-- Sidebar Thumbnail -->
    <div class="char-switch" role="group" aria-label="Pilih karakter">
        <button type="button" class="char-thumb active" id="thumb-2d" onclick="window.switchCharacter('2d')"
            title="Yiyi (2.5D)" aria-label="Yiyi (2.5D)" aria-pressed="true">
            <img src="/Assets/thumbnail/Thumbnail_yiyi.png" alt="">
        </button>
        <button type="button" class="char-thumb" id="thumb-3d" onclick="window.switchCharacter('3d')"
            title="Sakura (3D)" aria-label="Sakura (3D)" aria-pressed="false">
            <img src="/Assets/thumbnail/Thumbnail_sakura.png" alt="">
        </button>
    </div>

    <div class="chat-container" id="chat-panel" style="z-index: 10;">
        <button type="button" class="header" id="chat-toggle" aria-expanded="true" aria-controls="chat-box"
            title="Ciutkan chat">
            <span>Chat dengan AI Waifu</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="messages" id="chat-box" aria-live="polite"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik pesanmu di sini..." enterkeyhint="send"
                aria-label="Pesan" onkeypress="handleKeyPress(event)">
            <button type="button" id="mic-btn" class="mic-btn" onclick="toggleRecording()"
                aria-label="Rekam pesan suara">🎤</button>
            <button type="button" onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // Alamat backend. Kosong = server yang sama (api_server.py :8080).
        // Kalau frontend di-host terpisah (mis. Cloudflare Pages), isi window.SAKURA_API_URL sebelum script ini.
        const API_URL = (window.SAKURA_API_URL || "").replace(/\/$/, "");

        window.waifuModel2D = null;
        window.waifuModel3D = null;
        window.activeWaifuType = "2d";

        const canvas = document.getElementById('live2d-canvas');
        const app = new PIXI.Application({
            view: canvas,
            autoStart: true,
            transparent: true,
            resizeTo: window
        });
        const modelUrl = '/Character/PinkHair_workshop_2802653785/yiyi_chair.model3.json';

        // Definisi fungsi switchCharacter secara global agar selalu bisa dipanggil
        window.switchCharacter = function (type) {
            const container2D = document.getElementById('container-2d');
            const container3D = document.getElementById('container-3d');
            const thumb2D = document.getElementById('thumb-2d');
            const thumb3D = document.getElementById('thumb-3d');

            const is2D = type === '2d';
            container2D.style.display = is2D ? 'block' : 'none';
            container3D.style.display = is2D ? 'none' : 'block';
            window.activeWaifuType = is2D ? '2d' : '3d';
            for (const [thumb, active] of [[thumb2D, is2D], [thumb3D, !is2D]]) {
                if (!thumb) continue;
                thumb.classList.toggle('active', active);
                thumb.setAttribute('aria-pressed', String(active));
            }
            if (is2D) setTimeout(() => app.renderer.resize(window.innerWidth, window.innerHeight), 50);
            window.relayoutCharacter();
        };

        // --- Tata letak HP ---
        // Di layar sempit panel chat menutupi bagian bawah layar, jadi karakter
        // ditaruh di ruang di atasnya. Di desktop posisinya tetap seperti dulu.
        const MOBILE_MAX_WIDTH = 640;
        const chatPanel = document.getElementById('chat-panel');
        const chatToggle = document.getElementById('chat-toggle');

        window.isMobileLayout = () => window.innerWidth <= MOBILE_MAX_WIDTH;
        window.chatSheetHeight = () => window.isMobileLayout() ? chatPanel.offsetHeight : 0;

        const relayoutHooks = [];
        window.onRelayout = fn => relayoutHooks.push(fn);
        window.relayoutCharacter = () => relayoutHooks.forEach(fn => fn());

        chatToggle.addEventListener('click', () => {
            const collapsed = chatPanel.classList.toggle('collapsed');
            chatToggle.setAttribute('aria-expanded', String(!collapsed));
            chatToggle.title = collapsed ? 'Buka chat' : 'Ciutkan chat';
            window.relayoutCharacter();
        });

        PIXI.live2d.Live2DModel.from(modelUrl).then(model => {
            app.stage.addChild(model);

            // Kembalikan anchor ke tengah agar posisinya pas
            model.anchor.set(0.5);

            const DESKTOP_SCALE = 0.08;
            // Ukuran asli model (skala 1) untuk menghitung skala di HP
            model.scale.set(1);
            const baseWidth = model.width;
            const baseHeight = model.height;

            function resizeModel() {
                const w = app.screen.width;
                const h = app.screen.height;

                if (!window.isMobileLayout()) {
                    // Desktop: tengah layar, turun sedikit, skala tetap
                    model.scale.set(DESKTOP_SCALE);
                    model.x = w / 2;
                    model.y = h / 2 + h * 0.1;
                    return;
                }

                // HP: kepala dekat atas layar, kaki menyelinap di belakang panel chat
                // (seperti di desktop), jadi karakter tetap besar walau layar kecil
                const free = h - window.chatSheetHeight();
                const scale = Math.min(DESKTOP_SCALE, (free * 1.35) / baseHeight, (w * 0.98) / baseWidth);
                model.scale.set(scale);
                model.x = w / 2;
                model.y = free * 0.04 + (baseHeight * scale) / 2;
            }

            // Panggil sekali saat dimuat
            resizeModel();

            // Panggil otomatis setiap kali ukuran layar atau panel chat berubah
            window.addEventListener('resize', resizeModel);
            window.onRelayout(resizeModel);

            window.waifuModel = model;
            console.log("Model berhasil dimuat!");
        }).catch(err => {
            console.error("Gagal memuat model:", err);
        });


        // --- Audio balasan ---
        // Server mengirim teks dulu, lalu membuat suara di latar belakang.
        // `audio_wait` menunggu sampai suara siap. Antrean `audioQueue` memastikan
        // beberapa balasan diputar bergantian, tidak saling tumpang tindih.
        let audioQueue = Promise.resolve();

        async function getReplyAudioUrl(data) {
            if (data.audio) return data.audio;
            if (!data.audio_wait) return null;
            try {
                const res = await fetch(`${API_URL}${data.audio_wait}`);
                const info = await res.json();
                return info.ready ? info.url : null;
            } catch (err) {
                console.warn("Gagal mengambil audio:", err);
                return null;
            }
        }

        function playAudioUrl(url) {
            return new Promise(resolve => {
                const fullUrl = url.startsWith("/") ? API_URL + url : url;
                const audioBypassCache = fullUrl + "?t=" + new Date().getTime();

                // Mainkan suara secara manual menggunakan objek Audio
                const audio = new Audio(audioBypassCache);
                audio.onended = resolve;
                audio.onerror = resolve;
                audio.play().catch(e => { console.error("Gagal memutar audio:", e); resolve(); });

                if (window.waifuModel) {
                    try {
                        // Coba hubungkan ke Live2D untuk lip-sync
                        window.waifuModel.speak(audioBypassCache, { volume: 1.0 });
                    } catch (err) {
                        console.warn("Lip-sync tidak didukung oleh model ini:", err);
                    }
                }
            });
        }

        function playReplyAudio(data) {
            const urlPromise = getReplyAudioUrl(data);   // mulai menunggu sekarang (paralel)
            audioQueue = audioQueue.then(async () => {
                const url = await urlPromise;
                if (url) await playAudioUrl(url);
            });
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';

            try {

                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat: text, number: 1 })
                });

                const data = await response.json();
                if (data.balasan) {
                    appendMessage('waifu', data.balasan);

                    // Mainkan audio jika ada (otomatis lip-sync)
                    // Teks sudah tampil; audio dibuat di server lalu diputar begitu siap
                    playReplyAudio(data);
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage('waifu', 'Server backend mati/terputus.');
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text;
            messageDiv.appendChild(bubble);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // --- Fitur Microphone (Voice Chat) ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendVoiceMessage(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording'); // Merah saat merekam
                    micBtn.innerText = '⏹️';
                    micBtn.setAttribute('aria-label', 'Berhenti merekam dan kirim');
                } catch (error) {
                    console.error('Error accessing mic:', error);
                    alert("Gagal mengakses mikrofon. Pastikan browser memberi izin akses.");
                }
            } else {
                mediaRecorder.stop();
                // Matikan indikator mic di browser
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                micBtn.classList.remove('recording'); // Kembali abu-abu
                micBtn.innerText = '🎤';
                micBtn.setAttribute('aria-label', 'Rekam pesan suara');
            }
        }

        async function sendVoiceMessage(audioBlob) {
            appendMessage('user', '🎙️ (Pesan Suara...)');

            const formData = new FormData();
            formData.append("audio", audioBlob, "voice_message.webm");

            try {
                const response = await fetch(`${API_URL}/api/voice-chat`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.balasan) {
                    appendMessage('waifu', data.balasan);

                    // Teks sudah tampil; audio dibuat di server lalu diputar begitu siap
                    playReplyAudio(data);
                }
            } catch (error) {
                console.error('Error:', error);
                appendMessage('waifu', 'Server gagal memproses suara.');
            }
        }
    </script>
    <!-- GLTFLoader, OrbitControls & three-vrm mengimpor 'three' (bare specifier). Harus URL yang sama dengan app.js -->
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.154.0/build/three.module.js" } }
    </script>
    <script type="module" src="/app.js"></script>
</body>

</html>
